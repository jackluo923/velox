name: Test ARC Runner

on:
  push:
    branches:
      - test-arc-runner
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: arc-velox-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print runner information
        run: |
          echo "=================================="
          echo "Running on self-hosted ARC runner!"
          echo "=================================="
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "=================================="

      - name: System information
        run: |
          echo "Hostname: $(hostname)"
          echo "Kernel: $(uname -r)"
          echo "OS: $(cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2)"
          echo "CPU: $(nproc) cores"
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')"

      - name: Current directory
        run: |
          echo "Working directory: $(pwd)"
          ls -la

      - name: Test basic build tools
        run: |
          echo "Checking available tools..."
          which git && echo "✓ git available"
          which make && echo "✓ make available" || echo "✗ make not available"
          which gcc && echo "✓ gcc available" || echo "✗ gcc not available"
          which g++ && echo "✓ g++ available" || echo "✗ g++ not available"
          which cmake && echo "✓ cmake available" || echo "✗ cmake not available"

      - name: Success message
        run: |
          echo "=================================="
          echo "✓ ARC runner test completed successfully!"
          echo "Runner is working for jackluo923/velox"
          echo "=================================="
